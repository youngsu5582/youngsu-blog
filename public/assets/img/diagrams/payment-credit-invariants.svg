<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">멱등성·순서·Lock의 적용 범위</title>
  <desc id="desc">결제 크레딧 시스템에서 요청 중복, 이벤트 순서, 잔액 동시 수정, 비동기 차감 중인 크레딧을 각각 다른 장치로 보호하는 다이어그램</desc>
  <rect width="1200" height="620" fill="#fffdf8"/>
  <path d="M55 105H1145" stroke="#222" stroke-width="3"/>
  <text x="60" y="72" font-family="Noto Sans KR, sans-serif" font-size="38" font-weight="700" fill="#222">멱등성 · 순서 · Lock의 적용 범위</text>
  <text x="60" y="96" font-family="Noto Sans KR, sans-serif" font-size="16" fill="#666">비슷해 보이는 문제라도, 지키려는 불변식에 따라 다른 장치를 사용한다</text>

  <g font-family="Noto Sans KR, sans-serif">
    <rect x="60" y="145" width="1080" height="86" rx="16" fill="#eaf3ff" stroke="#3984d8" stroke-width="3"/>
    <circle cx="110" cy="188" r="25" fill="#3984d8"/>
    <text x="110" y="197" text-anchor="middle" font-size="25" font-weight="700" fill="white">K</text>
    <text x="160" y="180" font-size="23" font-weight="700" fill="#1d5c9c">Idempotency-Key</text>
    <text x="160" y="210" font-size="22" fill="#222">같은 요청의 중복 방지</text>

    <rect x="60" y="255" width="1080" height="86" rx="16" fill="#fff0f4" stroke="#e35d82" stroke-width="3"/>
    <circle cx="110" cy="298" r="25" fill="#e35d82"/>
    <text x="110" y="307" text-anchor="middle" font-size="24" font-weight="700" fill="white">↕</text>
    <text x="160" y="290" font-size="23" font-weight="700" fill="#a33a58">orderId</text>
    <text x="160" y="320" font-size="22" fill="#222">같은 주문의 이벤트 순서 보장</text>

    <rect x="60" y="365" width="1080" height="86" rx="16" fill="#eef9ed" stroke="#4ca45b" stroke-width="3"/>
    <circle cx="110" cy="408" r="25" fill="#4ca45b"/>
    <text x="110" y="417" text-anchor="middle" font-size="24" font-weight="700" fill="white">U</text>
    <text x="160" y="400" font-size="23" font-weight="700" fill="#32733b">userId</text>
    <text x="160" y="430" font-size="22" fill="#222">한 사용자의 잔액 동시 수정 제어</text>

    <rect x="60" y="475" width="1080" height="86" rx="16" fill="#fff5df" stroke="#e4a52c" stroke-width="3"/>
    <circle cx="110" cy="518" r="25" fill="#e4a52c"/>
    <text x="110" y="527" text-anchor="middle" font-size="24" font-weight="700" fill="white">A</text>
    <text x="160" y="510" font-size="23" font-weight="700" fill="#9b6b0c">credit.active</text>
    <text x="160" y="540" font-size="22" fill="#222">비동기 차감 처리 중인 크레딧 보호</text>
  </g>
</svg>
